<main>
  <h2>Task Tracker</h2>

  <form id="task-form">
    <!-- Task Title Field -->
    <label for="task-title">Task Title:</label>
    <input
      type="text"
      id="task-title"
      name="taskTitle"
      placeholder="Enter task title"
      required
    />

    <!-- Description Field -->
    <label for="task-desc">Description:</label>
    <textarea
      id="task-desc"
      name="taskDesc"
      placeholder="Enter task description"
    ></textarea>

    <!-- Add Button -->
    <button type="submit" id="add-task-btn">Add Task</button>
  </form>
</main>
